steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/vms-api/vms-api:$COMMIT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/vms-api/vms-api:$COMMIT_SHA']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - vms-api
      - --image=asia-southeast2-docker.pkg.dev/$PROJECT_ID/vms-api/vms-api:$COMMIT_SHA
      - --region=asia-southeast2
      - --platform=managed
      - --max-instances=3

images:
  - 'asia-southeast2-docker.pkg.dev/$PROJECT_ID/vms-api/vms-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
